services:
  - type: web
    name: coach-fulfillment-system
    env: node
    plan: starter
    buildCommand: "true"
    startCommand: node server.js
    nodeVersion: 22
    disk:
      name: coach-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /opt/render/project/src/data/coach.db
      - key: KEAP_TOKEN
        sync: false
